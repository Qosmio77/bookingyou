<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BookingYou Admin</title>
<!-- 主題要喺畫之前定好。擺落 app.js 就遲咗一步 —— 深色用家會見到一下白光。 -->
<script>
(function () {
  try {
    var t = localStorage.getItem('theme')
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
  } catch (e) { /* 私隱模式攞唔到 localStorage：跟系統就算，唔好連頁都開唔到 */ }
})()
</script>
<!-- ?v= 係 cache 破除用。改 style.css / app.js 就要 +1 -->
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <!-- login view -->
  <section id="login" class="login hidden">
    <h1>BookingYou Admin</h1>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="密碼" autocomplete="current-password">
    <button id="loginBtn">登入</button>
    <p id="loginErr" class="err"></p>
  </section>

  <!-- main view -->
  <section id="main" class="hidden">
    <header>
      <span id="title">總覽</span>
      <div class="hdr-act">
        <button id="themeBtn" title="切換深色／淺色">🌙</button>
        <button id="logoutBtn" title="登出">⎋</button>
      </div>
    </header>
    <div id="content"></div>
    <nav>
      <button data-tab="overview"   class="active">📊<span>總覽</span></button>
      <button data-tab="businesses">🏪<span>商家</span></button>
      <button data-tab="bookings">📅<span>預約</span></button>
      <button data-tab="complaints">🚩<span>投訴</span></button>
    </nav>
  </section>

  <div id="toast" class="hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
