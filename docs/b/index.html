<title>BookingYou</title>
<!--
  免下載預約頁。

  呢頁以前只係一個「開 App／去商店」嘅導流頁，1.7 秒之後就自動跳去 App Store ——
  即係話商戶叫舊客用條連結，每個客都要先裝一個 App 先落到單。而家呢頁自己落到單。

  ·  讀資料：直接打 Supabase REST，用 anon key（商戶、服務、營業時間、已佔用時段
     呢幾樣本身就係公開可讀，App 未登入都係咁讀）。
  ·  落單／睇返／取消：經 Edge Function `web-book`。anon 插唔到 bookings，亦都唔應該插到。
  ·  冇戶口，所以憑證係一個喺呢部機生成嘅隨機 token。伺服器只存佢嘅 sha256。
     管理連結就係 ?t=<token>。

  可約時段嘅計法同 App 嘅 useAvailability 一樣，亦同資料庫 trigger 一樣 ——
  三邊唔一致嘅話，就會出現「畫面話有位、撳落去話冇」。最終以伺服器為準。
-->
<style>
  :root {
    --navy:#1B3B6E; --teal:#2FB5AD; --teal-soft:#E4F6F5;
    --bg:#F3F6FB; --surface:#FFFFFF; --text:#14233B; --muted:#65758C; --line:#E1E8F2;
    --danger:#C8372D; --danger-soft:#FCEBE9; --warn:#B7791F; --warn-soft:#FDF3E1;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark) {

      --danger:#FF8A80; --danger-soft:#3A1B19; --warn:#F2C14E; --warn-soft:#3A2E12;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Hiragino Sans","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
    font-size:16px; line-height:1.5;
    padding:0 16px calc(32px + env(safe-area-inset-bottom));
  }
  main { max-width:520px; margin:0 auto; }
  .brand { display:flex; align-items:center; justify-content:space-between; padding:18px 2px 14px; }
  .logo { font-size:15px; font-weight:800; letter-spacing:3px; color:var(--navy); text-decoration:none; }
  .logo span { color:var(--teal); }
  .lang { width:auto; max-width:46%; font:inherit; font-size:13px; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:999px; padding:5px 10px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:12px; }
  h1 { font-size:22px; line-height:1.25; margin:0 0 4px; }
  h2 { font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }

  .meta a, .summary a { color:var(--navy); font-weight:600; text-decoration:none; }

             border:1px solid var(--line); border-radius:999px; padding:5px 12px; }
  .cover { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:12px; margin-bottom:14px; background:var(--teal-soft); display:block; }

         background:transparent; border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:8px; cursor:pointer; }
  .svc[aria-pressed="true"] { border-color:var(--teal); background:var(--teal-soft); }

  .svc small { color:var(--muted); font-size:13px; }
  .svc .price { margin-left:auto; font-weight:700; white-space:nowrap; font-size:15px; }

  .days { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; margin:0 -4px; padding-left:4px; }
  .days::-webkit-scrollbar { display:none; }
  .day { flex:0 0 auto; width:58px; padding:9px 0; text-align:center; font:inherit; color:inherit;
         background:transparent; border:1px solid var(--line); border-radius:12px; cursor:pointer; }
  .day small { display:block; font-size:12px; color:var(--muted); }
  .day b { display:block; font-size:18px; line-height:1.2; }
  .day[aria-pressed="true"] { border-color:var(--teal); background:var(--teal-soft); }
  .day:disabled { opacity:.35; cursor:default; }

  .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; }
  .slot { font:inherit; font-variant-numeric:tabular-nums; font-weight:600; color:inherit; background:transparent;
          border:1px solid var(--line); border-radius:10px; padding:11px 0; cursor:pointer; }
  .slot[aria-pressed="true"] { border-color:var(--teal); background:var(--teal); color:#fff; }
  .slot small { display:block; font-weight:500; font-size:11px; color:var(--muted); }
  .slot[aria-pressed="true"] small { color:#fff; opacity:.9; }

  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:12px 0 5px; }
  input, textarea, select {
    width:100%; font:inherit; color:var(--text); background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:12px 13px;
  }
  textarea { min-height:70px; resize:vertical; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline:2px solid var(--teal); outline-offset:1px; }
  .stepper { display:flex; align-items:center; gap:14px; }
  .stepper button { width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:transparent; color:inherit; font-size:20px; cursor:pointer; }
  .stepper output { font-size:18px; font-weight:700; min-width:24px; text-align:center; }

  .btn { display:block; width:100%; font:inherit; font-weight:700; font-size:16px; text-align:center; text-decoration:none;
         color:#fff; background:var(--navy); border:0; border-radius:14px; padding:15px; cursor:pointer; }
  @media (prefers-color-scheme: dark) { .btn { color:#0D1420; } }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.ghost { background:transparent; color:var(--navy); border:1px solid var(--line); }
  .btn.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .btn + .btn { margin-top:10px; }

  .note { font-size:13px; color:var(--muted); margin:10px 0 0; }
  .banner { border-radius:12px; padding:12px 14px; font-size:14px; margin-bottom:12px; }
  .banner.err { background:var(--danger-soft); color:var(--danger); }
  .banner.warn { background:var(--warn-soft); color:var(--warn); }
  .summary { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:15px; margin:0; }
  .summary dt { color:var(--muted); }
  .summary dd { margin:0; font-weight:600; }
  .status { display:inline-block; font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .status.confirmed { background:var(--teal-soft); color:var(--teal); }
  .status.pending { background:var(--warn-soft); color:var(--warn); }
  .status.cancelled, .status.completed { background:var(--line); color:var(--muted); }
  .big { font-size:40px; line-height:1; margin:0 0 10px; }
  .center { text-align:center; }
  .spinner { width:30px; height:30px; margin:40px auto; border-radius:50%; border:3px solid var(--line); border-top-color:var(--teal); animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration:2.4s; } }
  .hidden { display:none !important; }
  .appcta { font-size:14px; color:var(--muted); text-align:center; margin-top:18px; }
  .appcta a { color:var(--navy); font-weight:600; }
</style>

  };

  function pickLang() {
    var q = new URLSearchParams(location.search).get('lang');
    var saved = null; try { saved = localStorage.getItem('by_lang'); } catch (e) {}
    var want = q || saved || navigator.language || 'en';
    if (T[want]) return want;
    var low = want.toLowerCase();
    if (low.indexOf('zh') === 0) return /cn|hans|sg/.test(low) ? 'zh-CN' : 'zh-HK';
    var base = low.split('-')[0];
    return T[base] ? base : 'en';
  }
  var LANG = pickLang();
  function t(key, vars) {
    var s = (T[LANG] && T[LANG][key]) || T.en[key] || key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.replace('{' + k + '}', vars[k]); });
    return s;
  }

  // ── 小工具 ──────────────────────────────────────────────────────────────
  var app = document.getElementById('app');
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  // 要篩走 null：replaceChildren(null) 唔係「乜都唔放」，係放一個寫住 "null" 嘅文字節點。
  function show() { app.replaceChildren.apply(app, Array.prototype.filter.call(arguments, Boolean)); window.scrollTo(0, 0); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function rest(path) {
    return fetch(CFG.supa + '/rest/v1/' + path, { headers: { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon } })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  function fn(body) {
    return fetch(CFG.supa + '/functions/v1/web-book', {
      method: 'POST',
      headers: { 'content-type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.http = r.status; return j; }); });
  }

  // ── 時區：揀嘅日期同 "HH:MM" 係店舖牆上個鐘，唔係部電話嘅 ─────────────────
  function offsetMs(instant, tz) {
    var parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(instant);
    var g = function (type) { for (var i = 0; i < parts.length; i++) if (parts[i].type === type) return Number(parts[i].value); return 0; };
    var asIfUtc = Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute'), g('second'));
    return asIfUtc - Math.floor(instant.getTime() / 1000) * 1000;
  }
  function zonedToUtc(dateKey, hhmm, tz) {
    var d = dateKey.split('-').map(Number), h = hhmm.split(':').map(Number);
    var guess = Date.UTC(d[0], d[1] - 1, d[2], h[0], h[1]);
    var off = offsetMs(new Date(guess), tz), utc = guess - off;
    var off2 = offsetMs(new Date(utc), tz);           // 夏令時間交界嗰日要再對一次
    if (off2 !== off) utc = guess - off2;
    return new Date(utc);
  }
  function zonedDateKey(instant, tz) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(instant);
  }
  function addDays(dateKey, n) {
    var d = dateKey.split('-').map(Number);
    return new Date(Date.UTC(d[0], d[1] - 1, d[2] + n)).toISOString().slice(0, 10);
  }
  function weekdayOf(dateKey) { var d = dateKey.split('-').map(Number); return new Date(Date.UTC(d[0], d[1] - 1, d[2])).getUTCDay(); }
  function mins(hhmm) { var p = hhmm.split(':').map(Number); return p[0] * 60 + p[1]; }
  function hhmm(total) { return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0'); }
  function sameZoneAsDevice(tz) { try { return offsetMs(new Date(), tz) === -new Date().getTimezoneOffset() * 60000; } catch (e) { return true; } }

  function fmtDate(dateKey, tz, opts) {
    return new Intl.DateTimeFormat(LANG, Object.assign({ timeZone: 'UTC' }, opts)).format(new Date(dateKey + 'T00:00:00Z'));
  }
  function fmtTimeIn(instant, tz) {
    return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hourCycle: 'h23', hour: '2-digit', minute: '2-digit' }).format(instant);
  }
  function fmtPrice(svc, currency) {
    if (svc.price_on_request) return t('ask');
    var p = Number(svc.price || 0);
    if (!(p > 0)) return t('free');
    var f = function (n) {
      try { return new Intl.NumberFormat(LANG, { style: 'currency', currency: currency || 'HKD', minimumFractionDigits: 0, maximumFractionDigits: n % 1 === 0 ? 0 : 2 }).format(n); }
      catch (e) { return (currency || '') + ' ' + n; }
    };
    var max = svc.price_max == null ? null : Number(svc.price_max);
    return max != null && max > p && f(max) !== f(p) ? f(p) + ' – ' + f(max) : f(p);
  }

  // ── 狀態 ────────────────────────────────────────────────────────────────
  var S = { shop: null, services: [], schedule: [], blocked: [], svc: null, duration: 0, date: null, slot: null, slots: null, party: 1, error: null, busy: false };
  var params = new URLSearchParams(location.search);
  var shopId = params.get('id');
  var manageToken = params.get('t');

  // ── 畫面：載入失敗／搵唔到 ───────────────────────────────────────────────
  function notice(icon, title, sub, action) {
    show(el('div', { class: 'card center' }, [
      el('p', { class: 'big', text: icon, 'aria-hidden': 'true' }),
      el('h1', { text: title }), el('p', { class: 'meta', text: sub || '' }),
      action ? el('div', { style: 'margin-top:18px' }, [action]) : null
    ]));
  }
  function appLinks() {
    var ua = navigator.userAgent || '';
    var store = /Android/i.test(ua) ? PLAYSTORE : APPSTORE;
    return el('p', { class: 'appcta' }, [t('getApp') + ' ', el('a', { href: store, text: 'App Store / Google Play' })]);
  }

  function openInApp() {
    return el('div', {}, [
      el('a', { class: 'btn', href: 'bookingapp://business/' + shopId, text: t('openApp') }),
      appLinks()
    ]);
  }

  // ── 畫面：管理連結 ───────────────────────────────────────────────────────
  function manage(token) {
    show(el('div', { class: 'spinner', role: 'status' }));
    fn({ action: 'get', token: token }).then(function (r) {
      if (r.http === 404) return notice('🔎', t('notFoundBooking'), t('notFoundBookingSub'));
      if (r.http !== 200 || !r.booking) return notice('📡', t('loadFail'), '', el('button', { class: 'btn', text: t('retry'), onclick: function () { manage(token); } }));
      renderBooking(r.booking, token, null);
    }).catch(function () {
      notice('📡', t('loadFail'), '', el('button', { class: 'btn', text: t('retry'), onclick: function () { manage(token); } }));
    });
  }

  function renderBooking(b, token, headline) {
    var tz = b.timezone || 'Asia/Hong_Kong';
    var start = new Date(b.starts_at), end = new Date(b.ends_at);
    var dateKey = zonedDateKey(start, tz);
    var when = fmtDate(dateKey, tz, { weekday: 'long', month: 'long', day: 'numeric' }) + ' · ' + fmtTimeIn(start, tz) + ' – ' + fmtTimeIn(end, tz);
    var live = b.status === 'pending' || b.status === 'confirmed';
    var err = el('div', { class: 'banner err hidden', role: 'alert' });

    var cancelBtn = live ? el('button', { class: 'btn danger', text: t('cancel'), onclick: function () {
      if (!window.confirm(t('cancelAsk'))) return;
      cancelBtn.disabled = true;
      fn({ action: 'cancel', token: token }).then(function (r) {
        if (r.http === 200) { b.status = 'cancelled'; renderBooking(b, token, t('cancelled')); }
        else { cancelBtn.disabled = false; err.textContent = t('e_' + (r.code || 'failed')); err.classList.remove('hidden'); }
      }).catch(function () { cancelBtn.disabled = false; err.textContent = t('loadFail'); err.classList.remove('hidden'); });
    } }) : null;

    show(
      headline ? el('div', { class: 'banner warn', text: headline }) : null,
      el('div', { class: 'card' }, [
        el('span', { class: 'status ' + b.status, text: t('st_' + b.status) }),
        el('h1', { style: 'margin-top:10px', text: b.service_name }),
        el('p', { class: 'meta', text: b.business_name }),
        el('dl', { class: 'summary', style: 'margin-top:16px' }, [
          el('dt', { text: t('when') }), el('dd', { text: when }),
          b.party_size > 1 ? el('dt', { text: t('people') }) : null, b.party_size > 1 ? el('dd', { text: String(b.party_size) }) : null,
          b.business_address ? el('dt', { text: t('where') }) : null, b.business_address ? el('dd', { text: b.business_address }) : null,
          b.business_phone ? el('dt', { text: t('phone') }) : null, b.business_phone ? el('dd', {}, [el('a', { href: 'tel:' + b.business_phone, text: b.business_phone })]) : null
        ]),
        sameZoneAsDevice(tz) ? null : el('p', { class: 'note', text: t('shopTime', { zone: tz }) })
      ]),
      err,
      cancelBtn,
      el('a', { class: 'btn ghost', href: '?id=' + encodeURIComponent(b.business_id) + '&lang=' + LANG, text: t('again') }),
      appLinks()
    );
  }

  // ── 畫面：落單 ───────────────────────────────────────────────────────────
  function loadShop() {
    show(el('div', { class: 'spinner', role: 'status' }));
    var q = encodeURIComponent(shopId);
    Promise.all([
      rest('businesses?id=eq.' + q + '&select=id,name,description,address,phone,images,is_active,timezone,currency,web_booking_enabled,web_paused_until'),
      rest('services?business_id=eq.' + q + '&is_active=eq.true&select=*&order=created_at'),
      rest('availability?business_id=eq.' + q + '&select=day_of_week,start_time,end_time,requires_confirmation&order=start_time'),
      rest('blocked_dates?business_id=eq.' + q + '&select=blocked_date')
    ]).then(function (r) {
      if (!r[0].length) return notice('🔎', t('notFoundShop'), t('notFoundShopSub'));
      S.shop = r[0][0]; S.services = r[1];
      S.schedule = r[2].map(function (a) { return { dow: a.day_of_week, start: String(a.start_time).slice(0, 5), end: String(a.end_time).slice(0, 5), needs: a.requires_confirmation !== false }; });
      S.blocked = r[3].map(function (b) { return b.blocked_date; });
      document.title = S.shop.name + ' · BookingYou';
      if (S.shop.is_active === false || !S.services.length || !S.schedule.length) return notice('🚪', S.shop.name, t('shopClosed'), appLinks());
      // 店主熄咗網頁預約，或者熔斷器跳咗：唔好畀人填晒成份表格先話唔得。
      if (S.shop.web_booking_enabled === false) return notice('📱', S.shop.name, t('webOff'), openInApp());
      if (S.shop.web_paused_until && Date.parse(S.shop.web_paused_until) > Date.now()) return notice('⏸️', S.shop.name, t('e_web_paused'), openInApp());
      if (S.services.length === 1) chooseService(S.services[0]); else render();
    }).catch(function () {
      notice('📡', t('loadFail'), '', el('button', { class: 'btn', text: t('retry'), onclick: loadShop }));
    });
  }

  function tzOf() { return S.shop.timezone || 'Asia/Hong_Kong'; }

  function chooseService(svc) {
    S.svc = svc; S.slot = null; S.slots = null; S.error = null; S.party = 1;
    S.duration = svc.custom_duration && svc.min_duration_minutes ? svc.min_duration_minutes : svc.duration_minutes;
    if (S.date) loadSlots(); else render();
  }

  function durationChoices(svc) {
    if (!svc.custom_duration || !svc.min_duration_minutes || !svc.max_duration_minutes) return null;
    var step = svc.duration_step_minutes || 1, out = [];
    // 分鐘級步長會有成百個選項；淨係留啱格、又係 15 分鐘整數嘅，頭尾一定保留。
    for (var v = svc.min_duration_minutes; v <= svc.max_duration_minutes; v += step) out.push(v);
    if (out.length > 16) out = out.filter(function (v, i) { return i === 0 || i === out.length - 1 || v % 15 === 0; });
    return out;
  }

  function dayOpen(dateKey) {
    if (S.blocked.indexOf(dateKey) >= 0) return false;
    var dow = weekdayOf(dateKey);
    return S.schedule.some(function (a) { return a.dow === dow; });
  }

  // keepError：落單被拒之後重新攞時段表嗰陣，要留住「點解被拒」嗰句。第一版喺呢度
  // 無條件清咗 error，結果客人撳完確認，個表格無聲無息消失，乜解釋都冇。
  function loadSlots(keepError) {
    S.slots = null; S.slot = null; if (!keepError) S.error = null; render();
    var tz = tzOf(), dateKey = S.date, svc = S.svc, duration = S.duration;
    var from = zonedToUtc(dateKey, '00:00', tz), to = zonedToUtc(addDays(dateKey, 1), '00:00', tz);
    var q = encodeURIComponent(shopId);
    Promise.all([
      // 重疊，唔係包含：跨午夜嘅單都要計。
      rest('busy_slots?business_id=eq.' + q + '&start_time=lt.' + encodeURIComponent(to.toISOString()) + '&end_time=gt.' + encodeURIComponent(from.toISOString()) + '&select=start_time,end_time,service_id'),
      rest('reserved_slot_times?business_id=eq.' + q + '&slot_date=eq.' + dateKey + '&select=start_time,end_time')
    ]).then(function (r) {
      if (S.date !== dateKey || S.svc !== svc || S.duration !== duration) return;   // 期間揀咗第二日
      var busy = r[0].map(function (b) { return { s: Date.parse(b.start_time), e: Date.parse(b.end_time), svc: b.service_id }; });
      var reserved = r[1].map(function (x) { return { s: String(x.start_time).slice(0, 5), e: String(x.end_time).slice(0, 5) }; });
      var step = svc.custom_duration ? (svc.slot_step_minutes || 15) : duration;
      var buffer = Math.max(0, svc.buffer_minutes || 0) * 60000;
      var now = Date.now(), dow = weekdayOf(dateKey), out = [];
      if (!(duration > 0) || !(step > 0)) { S.slots = []; return render(); }

      S.schedule.filter(function (a) { return a.dow === dow; }).forEach(function (win) {
        for (var c = mins(win.start); c + duration <= mins(win.end); c += step) {
          var label = hhmm(c), endLabel = hhmm(c + duration);
          var startMs = zonedToUtc(dateKey, label, tz).getTime(), endMs = startMs + duration * 60000;
          if (startMs <= now) continue;
          // 同資料庫 trigger 一樣：第二個服務撞到就直接冇；同一個服務就計位，並且前後各佔住個緩衝。
          var hit = busy.filter(function (b) { var pad = b.svc === svc.id ? buffer : 0; return startMs < b.e + pad && endMs + pad > b.s; });
          if (hit.some(function (b) { return b.svc !== svc.id; })) continue;
          var taken = hit.filter(function (b) { return b.svc === svc.id; }).length;
          if (svc.max_capacity != null && svc.max_capacity > 0 && taken >= svc.max_capacity) continue;
          if (reserved.some(function (x) { return label < x.e && endLabel > x.s; })) continue;
          // 網頁單一律要店主確認（migration 064），同個服務有冇開即時確認無關 —— 照實講，
          // 唔好寫「即時確認」然後畀張待確認嘅單人。
          out.push({ start: label, end: endLabel, startMs: startMs, endMs: endMs, needs: true });
        }
      });
      S.slots = out; render();
    }).catch(function () { S.slots = []; S.error = t('loadFail'); render(); });
  }

  function submit(form) {
    if (S.busy || !S.slot) return;
    var name = form.name.value.trim(), phone = form.phone.value.trim();
    if (!name) { S.error = t('e_name_required'); return render(); }
    if (!/^[+()\-\s\d]{6,24}$/.test(phone)) { S.error = t('e_phone_required'); return render(); }
    store('by_name', name); store('by_phone', phone);

    // token 喺送出之前生成同存低。網絡斷咗再撳一次會帶住同一個 token，
    // 伺服器就會回返原本嗰張單，唔會變兩張。
    var key = 'by_pending_' + S.svc.id + '_' + S.slot.startMs, token = null;
    try { token = sessionStorage.getItem(key); } catch (e) {}
    if (!token) {
      var bytes = new Uint8Array(32); crypto.getRandomValues(bytes);
      token = btoa(String.fromCharCode.apply(null, bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      try { sessionStorage.setItem(key, token); } catch (e) {}
    }

    S.busy = true; S.error = null; render();
    var slot = S.slot;
    fn({
      action: 'create', token: token, serviceId: S.svc.id,
      start: new Date(slot.startMs).toISOString(), end: new Date(slot.endMs).toISOString(),
      name: name, phone: phone, partySize: S.party, notes: form.notes.value.trim() || null
    }).then(function (r) {
      S.busy = false;
      if (r.http === 200) return done(token, r.status, slot);
      S.error = t('e_' + (r.code || 'failed'));
      try { sessionStorage.removeItem(key); } catch (e) {}
      // 個位冇咗：攞過個新嘅時段表，唔好畀人再撳同一格。
      if (/slot_|booking_conflict|booking_past/.test(r.code || '')) return loadSlots(true);
      if (/web_disabled|web_paused/.test(r.code || '')) return notice(r.code === 'web_paused' ? '⏸️' : '📱', S.shop.name, S.error, openInApp());
      render();
    }).catch(function () { S.busy = false; S.error = t('loadFail'); render(); });
  }

  function done(token, status, slot) {
    var link = location.origin + location.pathname + '?t=' + token;
    var tz = tzOf();
    var copyBtn = el('button', { class: 'btn ghost', text: t('copy'), onclick: function () {
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () { copyBtn.textContent = t('copied'); })
        .catch(function () { window.prompt(t('manageLink'), link); });
    } });
    // 換咗網址：重新整理唔會再送一次表格，返上一頁亦唔會返去一個已經約咗嘅時段。
    try { history.replaceState(null, '', '?t=' + token + '&lang=' + LANG); } catch (e) {}
    show(
      el('div', { class: 'card center' }, [
        el('p', { class: 'big', text: status === 'confirmed' ? '✅' : '⏳', 'aria-hidden': 'true' }),
        el('h1', { text: status === 'confirmed' ? t('doneConfirmed') : t('donePending') }),
        el('p', { class: 'meta', text: status === 'confirmed' ? t('doneSubConfirmed') : t('doneSubPending') })
      ]),
      el('div', { class: 'card' }, [
        el('dl', { class: 'summary' }, [
          el('dt', { text: t('where') }), el('dd', { text: S.shop.name }),
          el('dt', { text: t('service') }), el('dd', { text: S.svc.name }),
          el('dt', { text: t('when') }), el('dd', { text: fmtDate(S.date, tz, { weekday: 'long', month: 'long', day: 'numeric' }) + ' · ' + slot.start + ' – ' + slot.end })
        ])
      ]),
      el('div', { class: 'card' }, [
        el('h2', { text: t('manageLink') }),
        el('p', { class: 'note', style: 'margin:0 0 12px', text: t('manageHint') }),
        el('a', { class: 'btn', href: link, text: t('view') }), copyBtn
      ]),
      appLinks()
    );
  }

  function render() {
    var tz = tzOf(), svc = S.svc, cur = S.shop.currency;
    var cover = S.shop.images && S.shop.images[0];
    var head = el('div', { class: 'card' }, [
      cover ? el('img', { class: 'cover', src: cover, alt: '', loading: 'lazy' }) : null,
      el('h1', { text: S.shop.name }),
      S.shop.address ? el('p', { class: 'meta', text: S.shop.address }) : null,
      // 「已經有 App？」而唔係「用 App 開啟」：呢粒掣對所有人都顯示，而網頁冇辦法知部機
      // 有冇裝 App（瀏覽器基於私隱唔畀查）。寫成指示嘅話，冇裝嘅人撳落去，iOS Safari 會彈
      // 「網址無效」；寫成問句，冇 App 嘅人自然唔會撳。螢幕閱讀器就讀埋個動作。
      el('a', { class: 'applink', href: 'bookingapp://business/' + shopId, text: t('haveApp') + ' ↗', 'aria-label': t('haveApp') + ' ' + t('openApp') })
    ]);

    var svcCard = el('div', { class: 'card' }, [el('h2', { text: t('pickService') })].concat(S.services.map(function (s) {
      var len = s.custom_duration && s.min_duration_minutes ? s.min_duration_minutes + '–' + s.max_duration_minutes : s.duration_minutes;
      return el('button', { class: 'svc', type: 'button', 'aria-pressed': String(svc === s), onclick: function () { chooseService(s); } }, [
        el('span', {}, [el('b', { text: s.name }), el('small', { text: len + ' ' + t('min') })]),
        el('span', { class: 'price', text: fmtPrice(s, cur) })
      ]);
    })));

    var kids = [head, svcCard];

    if (svc) {
      var choices = durationChoices(svc);
      if (choices) {
        var sel = el('select', { id: 'dur', onchange: function () { S.duration = Number(sel.value); if (S.date) loadSlots(); } }, choices.map(function (v) {
          return el('option', { value: v, selected: v === S.duration, text: v + ' ' + t('min') });
        }));
        kids.push(el('div', { class: 'card' }, [el('h2', { text: t('duration') }), sel]));
      }

      var today = zonedDateKey(new Date(), tz), days = [];
      for (var i = 0; i < DAYS_AHEAD; i++) days.push(addDays(today, i));
      kids.push(el('div', { class: 'card' }, [
        el('h2', { text: t('pickDate') }),
        el('div', { class: 'days' }, days.map(function (d) {
          var open = dayOpen(d);
          return el('button', { class: 'day', type: 'button', disabled: !open, 'aria-pressed': String(S.date === d),
            'aria-label': fmtDate(d, tz, { weekday: 'long', month: 'long', day: 'numeric' }) + (open ? '' : ' — ' + t('closedDay')),
            onclick: function () { S.date = d; loadSlots(); } }, [
            el('small', { text: fmtDate(d, tz, { weekday: 'short' }) }),
            el('b', { text: String(Number(d.slice(8))) }),
            el('small', { text: fmtDate(d, tz, { month: 'short' }) })
          ]);
        })),
        sameZoneAsDevice(tz) ? null : el('p', { class: 'note', text: t('shopTime', { zone: tz }) })
      ]));
    }

    if (svc && S.date) {
      var body;
      if (S.slots === null) body = el('div', { class: 'spinner', role: 'status' });
      else if (!S.slots.length) body = el('p', { class: 'meta', text: t('noSlots') });
      else body = el('div', { class: 'slots' }, S.slots.map(function (sl) {
        return el('button', { class: 'slot', type: 'button', 'aria-pressed': String(S.slot === sl), onclick: function () { S.slot = sl; S.error = null; render(); setTimeout(function () { var f = document.getElementById('details'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); } }, [
          sl.start, el('small', { text: sl.needs ? t('needsConfirm') : t('instant') })
        ]);
      }));
      if (S.error && !S.slot) kids.push(el('div', { id: 'slotErr', class: 'banner err', role: 'alert', text: S.error }));
      kids.push(el('div', { class: 'card' }, [el('h2', { text: t('pickTime') }), body,
        S.slots && S.slots.length ? el('p', { class: 'note', text: t('allPending') }) : null]));
    }

    if (svc && S.slot) {
      var maxParty = svc.max_party_size && svc.max_party_size > 1 ? svc.max_party_size : 1;
      var out = el('output', { text: String(S.party) });
      var form = el('form', { id: 'details', class: 'card', novalidate: true, onsubmit: function (e) { e.preventDefault(); submit(form); } }, [
        el('h2', { text: t('yourDetails') }),
        el('label', { for: 'name', text: t('name') }), el('input', { id: 'name', name: 'name', autocomplete: 'name', maxlength: 80, required: true, value: store('by_name') || '' }),
        el('label', { for: 'phone', text: t('phone') }), el('input', { id: 'phone', name: 'phone', type: 'tel', inputmode: 'tel', autocomplete: 'tel', maxlength: 24, required: true, value: store('by_phone') || '' }),
        maxParty > 1 ? el('label', { text: t('party') }) : null,
        maxParty > 1 ? el('div', { class: 'stepper' }, [
          el('button', { type: 'button', 'aria-label': '−', text: '−', onclick: function () { S.party = Math.max(1, S.party - 1); out.textContent = String(S.party); } }),
          out,
          el('button', { type: 'button', 'aria-label': '+', text: '+', onclick: function () { S.party = Math.min(maxParty, S.party + 1); out.textContent = String(S.party); } })
        ]) : null,
        el('label', { for: 'notes', text: t('notes') }), el('textarea', { id: 'notes', name: 'notes', maxlength: 500 }),
        S.error ? el('div', { class: 'banner err', role: 'alert', style: 'margin:14px 0 0', text: S.error }) : null,
        el('dl', { class: 'summary', style: 'margin:16px 0' }, [
          el('dt', { text: t('service') }), el('dd', { text: svc.name + ' · ' + fmtPrice(svc, cur) }),
          el('dt', { text: t('when') }), el('dd', { text: fmtDate(S.date, tz, { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + S.slot.start + ' – ' + S.slot.end })
        ]),
        el('button', { class: 'btn', type: 'submit', disabled: S.busy, text: S.busy ? t('booking') : t('book') }),
        svc.cancellation_note ? el('p', { class: 'note', text: svc.cancellation_note }) : null
      ]);
      kids.push(form);
    } else if (S.error && !(svc && S.date)) {
      kids.push(el('div', { class: 'banner err', role: 'alert', text: S.error }));
    }

    kids.push(appLinks());
    // 重畫會清走輸入緊嘅字；保住佢。
    var keep = {}; ['name', 'phone', 'notes'].forEach(function (k) { var n = document.getElementById(k); if (n) keep[k] = n.value; });
    var y = window.scrollY;
    app.replaceChildren.apply(app, kids.filter(Boolean));
    Object.keys(keep).forEach(function (k) { var n = document.getElementById(k); if (n && keep[k]) n.value = keep[k]; });
    window.scrollTo(0, y);
    // 日期條每次重畫都會捲返最左；揀咗三個星期後嗰日嘅話，佢就喺畫面外面。
    // 只郁條橫向捲軸，唔好用 scrollIntoView —— 嗰個會連成頁一齊捲。
    var strip = document.querySelector('.days'), on = strip && strip.querySelector('[aria-pressed="true"]');
    if (on) strip.scrollLeft = on.offsetLeft - strip.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2;
    // 表格收埋咗之後頁面矮咗，原本嘅位置可能已經唔存在 —— 帶個錯誤訊息入視線。
    var se = document.getElementById('slotErr'); if (se) se.scrollIntoView({ block: 'center' });
  }

  // ── 開波 ────────────────────────────────────────────────────────────────
  var langSel = document.getElementById('lang');
  langSel.value = LANG;
  document.documentElement.lang = LANG === 'zh-HK' ? 'zh-Hant' : LANG === 'zh-CN' ? 'zh-Hans' : LANG;
  langSel.addEventListener('change', function () {
    store('by_lang', langSel.value);
    var p = new URLSearchParams(location.search); p.set('lang', langSel.value);
    location.search = p.toString();
  });

  function boot() {
    if (manageToken) return manage(manageToken);
    if (shopId && /^[0-9a-f-]{36}$/i.test(shopId)) return loadShop();
    // 冇 id、冇 token：呢頁冇嘢做，返首頁。
    location.replace('/');
  }

  // 本機開發：localhost 先會試攞 dev-config.json（指去本機 Supabase）。正式站唔會發呢個請求。
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    fetch('dev-config.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (c) { if (c) { CFG.supa = c.supa; CFG.anon = c.anon; } }).catch(function () {}).then(boot);
  } else boot();
})();
</script>
</body>
</html>
