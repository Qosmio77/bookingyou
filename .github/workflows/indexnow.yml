name: Notify IndexNow after Pages deployment

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test notification logic
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Notify IndexNow of changed pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEXNOW_KEY_FILE: docs/32b259e3432c2843749bb0415752cabc.txt
        run: python3 .github/scripts/indexnow.py
